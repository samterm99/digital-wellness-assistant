name: release

# Builds the app, signs it through SignPath (SignPath Foundation, free for open source) and
# publishes the signed installer on a GitHub Release.
# Trigger: push a tag such as v1.2.0 (it must equal AppVersion in packaging/installer.iss),
# or run manually (workflow_dispatch) to get signed files as workflow artifacts without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  actions: read     # SignPath reads the uploaded artifact

env:
  APP_NAME: DigitalWellnessAssistant

jobs:
  build-sign-release:
    runs-on: windows-latest   # SignPath OSS: every job before signing must run on GitHub-hosted runners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches installer version
        shell: pwsh
        run: |
          $m = Select-String -Path packaging\installer.iss -Pattern '^#define AppVersion "([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "installer.iss AppVersion = $ver"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "Tag $env:GITHUB_REF_NAME does not match AppVersion v$ver in packaging/installer.iss (and version_info.txt)"
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Unit tests
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests

      - name: Build app (PyInstaller one-folder)
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name $env:APP_NAME --paths src
          --version-file packaging\version_info.txt
          --distpath dist --workpath build --specpath build
          packaging\launcher.py

      # ---- sign step 1: our exe --------------------------------------------------------------
      - name: Upload unsigned app
        id: upload-unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: dist/${{ env.APP_NAME }}

      - name: Sign app (SignPath)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      # ---- installer built from the signed app folder -------------------------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DSourceDir=$PWD\signed-app" "/DOutDir=$PWD\installer" packaging\installer.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed" }
          Get-ChildItem installer

      # ---- sign step 2: the installer ---------------------------------------------------------
      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: installer/*.exe

      - name: Sign installer (SignPath)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem signed-installer -Filter *.exe) + @(Get-Item "signed-app\$env:APP_NAME.exe")
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host ("{0}: {1} - {2}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject)
            if ($s.Status -ne 'Valid') { throw "Signature of $($f.Name) is $($s.Status)" }
          }

      - name: Keep signed files as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-${{ env.APP_VERSION }}
          path: signed-installer/*.exe

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Install: download the installer below and run it (Windows 10/11, 64-bit, no administrator rights needed).

          Free code signing provided by SignPath.io, certificate by SignPath Foundation.
          Privacy: this program does not transfer any information to other networked systems (see PRIVACY.md).
          "@
          $installer = (Get-ChildItem signed-installer -Filter *.exe | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $installer --title "Digital Wellness Assistant $env:GITHUB_REF_NAME" --notes $notes --verify-tag
