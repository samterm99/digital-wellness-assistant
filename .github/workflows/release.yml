name: release

# Builds the app and publishes a GitHub Release with two files:
#  1. the unsigned Windows installer (.exe)  - works on Windows 10 and on Windows 11 with Smart App Control off
#  2. the "script edition" zip (no .exe of ours; runs on the official Python) - works everywhere
# Releases are NOT code-signed.
# Trigger: push a tag such as v1.2.1, or run manually (workflow_dispatch) to get the files as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release

env:
  APP_NAME: DigitalWellnessAssistant
  SCRIPT_VERSION: "1.2.1"   # script edition package version (app version 1.2.0)

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read installer version
        shell: pwsh
        run: |
          $m = Select-String -Path packaging\installer.iss -Pattern '^#define AppVersion "([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "installer.iss AppVersion = $ver"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Unit tests
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests

      - name: Build app (PyInstaller one-folder)
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name $env:APP_NAME --paths src
          --version-file packaging\version_info.txt
          --distpath dist --workpath build --specpath build
          packaging\launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (unsigned)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DSourceDir=$PWD\dist\$env:APP_NAME" "/DOutDir=$PWD\installer" packaging\installer.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed" }
          Get-ChildItem installer

      - name: Build script edition zip
        shell: pwsh
        run: |
          $root = "script-pkg"
          New-Item -ItemType Directory -Force "$root\app" | Out-Null
          Copy-Item script-edition\* $root -Recurse
          Copy-Item src "$root\app\src" -Recurse
          Copy-Item LICENSE, PRIVACY.md "$root\app"
          Get-ChildItem "$root\app\src" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "$root\*" -DestinationPath "release\DigitalWellnessAssistant-Script-$env:SCRIPT_VERSION.zip"
          Copy-Item installer\*.exe release
          Get-ChildItem release

      - name: Keep files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.APP_VERSION }}
          path: release/*

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Two ways to install (Windows 10/11, 64-bit, no administrator rights needed):
          - **Script edition (DigitalWellnessAssistant-Script-*.zip)**: extract, double-click INSTALL.bat. Works everywhere, including Windows 11 with Smart App Control on. Uses the official Python (installed for you via winget if missing).
          - **Installer (DigitalWellnessAssistant-Setup-*.exe)**: Windows 10, or Windows 11 with Smart App Control off.

          These releases are not code-signed, so Windows SmartScreen may warn ("More info" > "Run anyway").
          Privacy: this program does not transfer any information to other networked systems (see PRIVACY.md).
          "@
          $files = Get-ChildItem release | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $files --title "Digital Wellness Assistant $env:GITHUB_REF_NAME" --notes $notes --verify-tag
